{% load static %}
<!DOCTYPE html>
<html>
<head>
  <style>
    html, body{ height: 100%; margin: 0; overflow: hidden; }
    body{ display: flex; flex-direction: column; }

    .hero{
      position: relative;
      flex: 1;              /* prend tout l'espace entre navbar et footer */
      min-height: 0;
    }
    .hero img{
      width: 100%;
      height: 100%;
      object-position: center;
      display: block;
    }
    .hero::after{
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 35%;
      background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0));
      pointer-events: none;
    }
    .hero-quote{
      position: absolute; left: 0; right: 0; bottom: 20px; z-index: 2;
      margin: 0; padding: 0 20px; text-align: center; color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }
  </style>
</head>

<body>
  {% include "blood/navbar.html" %}

  <section class="hero">
    <img src="{% static 'image/acceuil.png' %}" alt="Don de sang">
    <p class="lead hero-quote">“Opportunities knock the door sometimes, so don’t let it go and donate blood.”</p>
  </section>

  {% include "blood/footer.html" %}
</body>
</html>
